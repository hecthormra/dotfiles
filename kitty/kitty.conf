# ─────────────────────────────────────────────
# Kitty — Arc-Dark + JetBrains Mono Nerd Font
# ─────────────────────────────────────────────

# Fonte
font_family JetBrainsMono Nerd Font Mono
bold_font JetBrainsMono Nerd Font Mono
italic_font JetBrainsMono Nerd Font Mono
bold_italic_font JetBrainsMono Nerd Font Mono
symbol_map U+3000-U+30FF,U+31F0-U+31FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans CJK JP

font_size 11.0

# ─────────────────────────────────────────────
# Aparência
# ─────────────────────────────────────────────

background #383C4A
foreground #D8DEE9

cursor     #5294E2
cursor_text_color #383C4A

selection_background #4C566A
selection_foreground #ECEFF4

# Cores básicas
color0  #2E3440
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0

color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# ─────────────────────────────────────────────
# Janela
# ─────────────────────────────────────────────

window_padding_width 8
window_padding_height 6

# ── Janela e barra de título ──
hide_window_decorations yes

# Sem transparência exagerada
background_opacity 0.50
dynamic_background_opacity yes

# ─────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────

cursor_shape beam
cursor_beam_thickness 1.5
cursor_trail 5
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 3


# ─────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────

scrollback_lines 10000

# ─────────────────────────────────────────────
# Tab bar
# ─────────────────────────────────────────────

tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #ECEFF4
active_tab_background #4C566A
inactive_tab_foreground #AAB2C0
inactive_tab_background #2E3440

enabled_layouts splits,stack

map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current

map ctrl+shift+alt+h launch --location=hsplit --cwd=current
map ctrl+shift+alt+v launch --location=vsplit --cwd=current

map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

map ctrl+alt+left  resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+up    resize_window taller
map ctrl+alt+down  resize_window shorter

map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up   move_tab_backward

# ─────────────────────────────────────────────
# Shell
# ─────────────────────────────────────────────

shell_integration enabled
shell_integration no-cursor
paste_actions quote-urls-at-prompt

# ─────────────────────────────────────────────
# Desempenho
# ─────────────────────────────────────────────

repaint_delay 10
input_delay 3
sync_to_monitor yes
include theme-colors.conf

# ─────────────────────────────────────────────
# Integração com Quickshell
# ─────────────────────────────────────────────

allow_remote_control no










