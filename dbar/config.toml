[bar]
height = 24
position = "top"
margin = 0
gap = 8
font = "JetBrainsMono Nerd Font 11"
icon_size = 14

[bar.background]
color = "#2f343f55"
radius = 0

[colors]
base = "#2f343f"
text = "#d3dae3"
subtext = "#7c818c"
accent = "#5294e2"
warning = "#e5a50a"
critical = "#cc575d"

[left]
groups = ["desktop"]

[center]
groups = []

[right]
groups = ["status"]

# ---- estilos (texto puro, sem fundo, como a swaybar) ----

[style.plain]
foreground = "$text"
padding = 6
icon_gap = 4

[style.warning]
foreground = "$warning"
padding = 6
icon_gap = 4

[style.critical]
foreground = "$critical"
padding = 6
icon_gap = 4

[style.focused]
background = "$accent"
foreground = "#ffffff"
padding = 8

[style.dim]
foreground = "$subtext"
padding = 8

# ---- grupos ----

[group.desktop]
modules = ["workspaces"]
spacing = 2

[group.status]
modules = ["volume", "battery", "clock"]
spacing = 6

# ---- módulos ----

[module.workspaces]
source = "workspaces"
icons = { "1" = "󰆍", "2" = "󰖟", "3" = "󰉋", "4" = "󰎆", "5" = "󰭹" }
style = "dim"
min_width = 24

[module.workspaces.states.focused]
focused = true
style = "focused"

[module.workspaces.states.urgent]
urgent = true
style = "critical"

[module.volume]
source = "audio"
scroll = "5%"
format = "$volume.n(d:0)"
style = "plain"
icon = "$volume"

[module.volume.states.muted]
field = "muted"
equals = "yes"
foreground = "$subtext"
icon = "$volume-muted"

[module.battery]
source = "battery"
interval = "30s"
format = "$percent.n(d:0)"
style = "plain"
icon = "$battery"

[module.battery.states.plugged]
field = "supply"
equals = "mains"
icon = "$battery-charging"

[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"

[module.clock]
source = "time"
interval = "1m"
format = "$now.time(f:'%H:%M')"
style = "plain"
icon = "$clock"
